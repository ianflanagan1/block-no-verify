version: '3'

tasks:
  lint:
    desc: ShellCheck every shell script
    cmds:
      - shellcheck --external-sources scripts/*.sh bin/git
      - shellcheck --external-sources --shell sh tests/*.sh

  lint-file:
    desc: ShellCheck just the shell scripts given after --
    cmds:
      - |
        for f in {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}; do
          case $f in
            tests/*.sh | */tests/*.sh) shellcheck --external-sources --shell sh "$f" ;;
            *.sh | bin/* | */bin/*) shellcheck --external-sources "$f" ;;
          esac
        done

  test:
    desc: Run the shunit2 tests, or just the test files given after --
    vars:
      FILES: '{{if .CLI_ARGS_LIST}}{{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}{{else}}tests/*_test.sh{{end}}'
    cmds:
      # Every file runs, so one failure doesn't hide the rest.
      - |
        failed=0
        for t in {{.FILES}}; do
          echo "== $(basename "$t")"
          ROOT={{shellQuote .ROOT_DIR}} shunit2 "$t" || failed=1
        done
        exit "$failed"

  check:
    desc: Lint, then test, failing on any problem
    cmds:
      - task: lint
      - task: test
